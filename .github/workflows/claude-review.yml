# Revisor de código con Claude sobre cada PR. Publica los hallazgos como
# comentarios en el propio PR (en línea sobre el diff, más uno de resumen), no
# solo en el registro de la ejecución.
#
# Pasos manuales pendientes, credencial y coste: `docs/ci-revisor.md`.
name: Revisor (Claude)

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Un push nuevo al PR cancela la revisión en curso del anterior: no se paga por
# revisar un diff que ya no existe.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Revisión de Claude
    # Se salta, en vez de dejar un rojo que no dice nada:
    # - PRs desde un fork: GitHub no les pasa los secretos, y sin credencial la
    #   acción falla antes de revisar nada. Ver `docs/ci-revisor.md`.
    # - Borradores: se revisan al pasar a `ready_for_review`.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # leer el repo y el diff
      pull-requests: write # publicar los comentarios en el PR
      id-token: write # la acción lo cambia por el token de la GitHub App de Claude
    steps:
      # Acciones fijadas por SHA: una etiqueta se puede mover, un commit no.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@d1f58ad5e6f4d2b79547e63e37c2116064135896 # v1.0.277
        with:
          # Suscripción (Pro/Max): token de `claude setup-token`, guardado en el
          # secreto CLAUDE_CODE_OAUTH_TOKEN. Con una clave de API de la consola,
          # sustituir esta línea por
          #   anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # No son intercambiables: ver `docs/ci-revisor.md`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            Eres el revisor de código de este PR de FlowSync. Tu trabajo es
            encontrar defectos reales, no resumir el cambio. La rama del PR ya
            está en el directorio de trabajo.

            1. Si existe `REVIEW.md` en la raíz, léelo primero con Read: es la
               calibración de qué cuenta como hallazgo y con qué severidad.
               Lee también `CLAUDE.md`.
            2. Mira el cambio con `gh pr view` y `gh pr diff`. Abre con Read,
               Grep y Glob los ficheros que toca cuando el diff no baste para
               juzgar.
            3. Si el cambio toca una capability, contrástalo con su spec en
               `openspec/specs/<capability>/spec.md`.

            Publica cada hallazgo concreto como comentario en línea sobre la
            línea afectada con `mcp__github_inline_comment__create_inline_comment`
            (con `confirmed: true`), diciendo la severidad y por qué es un
            problema. Al final, un único comentario de resumen con
            `gh pr comment`. Si no encuentras nada que lo merezca, dilo en ese
            resumen en una línea. No dejes la revisión solo como mensaje: lo
            que no esté en un comentario del PR no lo lee nadie.

            No redirijas salida a ficheros (nada de `>`, `>>`, `tee` ni ficheros
            temporales): lee la salida directa de cada comando.
          claude_args: |
            --model sonnet --effort medium
            --max-turns 40
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
