# Revisor de código de Claude sobre cada PR, con los hallazgos comentados en el
# propio PR. Pasos manuales pendientes, credencial y coste: docs/ci-revisor.md
name: Revisor de Claude

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Un push nuevo al PR cancela la revisión del anterior: no se paga por revisar
# un diff que ya no existe.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Un PR desde un fork no recibe secretos ni token OIDC: el job fallaría en
    # la primera llamada. Se salta en vez de fallar (ver docs/ci-revisor.md).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout y lectura del repo
      pull-requests: write # comentarios en el PR
      id-token: write # la acción obtiene su token de la GitHub App por OIDC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@v1
        with:
          # Camino de suscripción (`claude setup-token`). Para usar una clave de
          # API de la consola, cambia la entrada Y el secreto a la vez:
          #   anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Eres el revisor de código de este PR de FlowSync.

            1. Lee primero `REVIEW.md` en la raíz del repo: es tu calibración
               (qué es grave, cuánto reportar, dónde no hacerlo). Si no existe,
               usa `CLAUDE.md` como guía de convenciones.
            2. Obtén el cambio con `gh pr view ${{ github.event.pull_request.number }}`
               y `gh pr diff ${{ github.event.pull_request.number }}` y lee su salida
               directamente. No redirijas la salida a ficheros (`>`, `>>`, `tee`)
               ni la encadenes con pipes: no está permitido y cada intento
               denegado te cuesta un turno.
            3. Abre con Read, Grep y Glob los archivos del cambio y lo que
               necesites para contrastarlo (por ejemplo `openspec/specs/`).
            4. Publica cada hallazgo en cuanto lo confirmes, como comentario en
               línea con `mcp__github_inline_comment__create_inline_comment` sobre
               la línea afectada, con la evidencia `archivo:línea`. Tienes un
               máximo de turnos: lo que no se publica se pierde.
            5. Cierra con un único comentario general (`gh pr comment`) que
               resuma la revisión.

            No modifiques archivos ni hagas commits.
          claude_args: |
            --model sonnet
            --effort medium
            --max-turns 40
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
