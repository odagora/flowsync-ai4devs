# Revisor de código con Claude sobre cada pull request.
#
# Publica los hallazgos como comentarios en el PR (en línea sobre el diff y un
# resumen general), no solo en el registro de la ejecución. Qué falta para que
# funcione, cuánto cuesta y cómo cambiar el modelo: docs/ci-revisor.md.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    name: claude-review
    # Ni borradores, ni PRs desde forks: a esos GitHub no les pasa los secretos
    # ni el token OIDC, y el job fallaría sin revisar nada (docs/ci-revisor.md).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Un push nuevo deja obsoleta la revisión en curso: se cancela para no
    # pagarla. A nivel de job y no de workflow, para que un evento que el `if`
    # salta (un push a un borrador) no cancele una revisión que sí vale.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      # Para comentar en el PR.
      pull-requests: write
      # La acción canjea un token OIDC por el token de la GitHub App de Claude.
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Suscripción (`claude setup-token`). Para usar una clave de API de la
          # consola, cambia esta línea por
          #   anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Las dos entradas no son intercambiables: ver docs/ci-revisor.md.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Revisa este pull request. Responde en castellano.

            Antes de empezar:
            - Si existe `REVIEW.md` en la raíz del repositorio, léelo con Read: es
              el archivo de calibración del revisor y manda sobre estas
              instrucciones generales. Lee también `CLAUDE.md`.
            - Obtén el diff con `gh pr diff ${{ github.event.pull_request.number }}`
              y el contexto con `gh pr view ${{ github.event.pull_request.number }}`.
              Abre con Read, Grep y Glob los ficheros que necesites para
              entender el cambio.

            No redirijas la salida de ningún comando a ficheros (ni `>`, ni
            `>>`, ni `tee`) ni la encadenes con pipes: lee la salida directa del
            comando. Cualquier otra forma te será denegada y te costará un turno.

            Busca errores de corrección, riesgos de seguridad y contradicciones
            con las reglas del repositorio. No comentes estilo que ya cubren
            el linter o el formateador.

            Publica cada hallazgo concreto como comentario en línea con
            `mcp__github_inline_comment__create_inline_comment`, sobre la línea
            del diff a la que se refiere. Al terminar, deja un único comentario
            general con `gh pr comment` que resuma lo encontrado, o que diga que
            no has encontrado nada si es el caso.
          claude_args: |
            --model sonnet --effort medium
            --max-turns 40
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
