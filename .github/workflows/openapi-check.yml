name: OpenAPI

# Comprueba que `docs/api/openapi.json` coincide con el documento que genera el
# código. Solo compara: si no coincide, el job falla y el arreglo es correr
# `npm run openapi:generate` en local y commitear el resultado.
on:
  pull_request:
  push:
    branches: [main]

# Solo lee el repo: ni comenta, ni escribe, ni sube nada.
permissions:
  contents: read

jobs:
  check:
    name: openapi:check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Versión exacta a propósito. Desde Node 24.21, `new URL()` rechaza las
      # URLs relativas que monta `jsonschema@1.5.0` (dependencia de
      # `@adonisjs/ace`) al validar los comandos de `commands/`, y cualquier
      # `node ace <comando propio>` falla con «Invalid URL». No hay versión
      # corregida de `jsonschema`; cuando la haya, esto puede volver a `24`.
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # El comando arranca la app, y `start/env.ts` valida el entorno al
      # arrancar. La clave es desechable: el documento no depende de ella.
      - run: cp .env.example .env && node ace generate:key

      - run: npm run openapi:check
