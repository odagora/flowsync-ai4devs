name: OpenAPI

# Cada PR, contra cualquier rama base, y cada push a main.
on:
  pull_request:
  push:
    branches: [main]

# Solo lee el código: no comenta, no etiqueta, no sube nada.
permissions:
  contents: read

jobs:
  openapi-check:
    name: docs/api/openapi.json al día con el código
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    # `start/env.ts` valida estas variables al arrancar y en CI no hay `.env`.
    # Ninguna es secreta: la comprobación no abre conexiones ni firma nada, así
    # que el APP_KEY solo tiene que existir.
    env:
      TZ: UTC
      NODE_ENV: development
      PORT: '3333'
      HOST: localhost
      LOG_LEVEL: info
      APP_KEY: ci-openapi-check-not-a-secret
      APP_URL: http://localhost:3333
      SESSION_DRIVER: memory
    steps:
      - uses: actions/checkout@v5
        with:
          # El job no hace push: no hace falta dejar el token en `.git/config`.
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          # Versión exacta, no `24`: con Node 24.22.2 Ace rechaza los comandos
          # de `commands/` al validarlos (`jsonschema` lanza «Invalid URL»),
          # y con 24.18.1 funcionan.
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run openapi:check
